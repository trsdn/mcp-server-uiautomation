# CodeQL configuration for UIAutomationMcp

name: "UIAutomationMcp CodeQL Configuration"
disable-default-queries: true

queries:
  - uses: security-extended

paths:
  - 'src/**'

# tests/** is excluded deliberately, not by accident of when it was empty.
# It now holds real C#, but test code is not shipped, and security findings in a
# test harness are noise against the analysis of the product itself. The
# corresponding paths-ignore in codeql.yml keeps the two consistent: test-only
# changes do not trigger an analysis that would not examine them anyway.
# Revisit if test code ever grows logic worth scanning in its own right.
paths-ignore:
  - '**/bin/**'
  - '**/obj/**'
  - '**/packages/**'
  - '**/.nuget/**'
  - '**/node_modules/**'
  - 'tests/**'
  - 'vscode-extension/out/**'
  - 'vscode-extension/bin/**'

query-filters:
  - exclude:
      id: cs/invalid-dynamic-call
      paths:
        - src/UIAutomationMcp.ComInterop/**

ml-powered-queries: true
trap-caching: true

