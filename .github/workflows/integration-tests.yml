name: UI Automation Smoke Checks

permissions:
  contents: read

on:
  # No paths filter here on purpose: smoke is a required status check on main.
  # A filtered job never reports on a PR that misses its paths, and the PR then
  # stays blocked forever waiting for a check that will never arrive.
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/integration-tests.yml'

jobs:
  smoke:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Build solution
        run: dotnet build UIAutomationMcp.sln -c Release

      - name: Run tests
        run: dotnet test UIAutomationMcp.sln -c Release --no-build --logger "console;verbosity=minimal"

      - name: Run smoke executable
        run: dotnet run --project src/UIAutomationMcp.Smoke/UIAutomationMcp.Smoke.csproj -c Release

      - name: Run CLI desktop query
        run: dotnet run --project src/UIAutomationMcp.CLI/UIAutomationMcp.CLI.csproj -c Release -- desktop

      - name: Run CLI focused query
        run: dotnet run --project src/UIAutomationMcp.CLI/UIAutomationMcp.CLI.csproj -c Release -- focused

