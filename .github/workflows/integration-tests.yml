name: UI Automation Smoke Checks

permissions:
  contents: read

on:
  # No paths filter here on purpose: smoke is a required status check on main.
  # A filtered job never reports on a PR that misses its paths, and the PR then
  # stays blocked forever waiting for a check that will never arrive.
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/integration-tests.yml'

jobs:
  smoke:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Build solution
        run: dotnet build UIAutomationMcp.sln -c Release

      # Guards two invariants the compiler cannot see: COM proxy release, and
      # CLI/MCP parity plus action-verb documentation. Both are dependency-free
      # and run in under a second. They fail loudly when they find nothing to
      # scan, so a check that verifies nothing can never report success - which
      # is exactly how the scripts these replaced rotted unnoticed.
      #
      # Placed before the runtime steps so a drift failure is reported on its
      # own rather than behind an unrelated smoke failure.
      - name: Run repository checks
        shell: pwsh
        run: |
          ./scripts/check-com-leaks.ps1
          ./scripts/check-cli-coverage.ps1

      - name: Run tests
        run: dotnet test UIAutomationMcp.sln -c Release --no-build --logger "console;verbosity=minimal"

      - name: Run smoke executable
        run: dotnet run --project src/UIAutomationMcp.Smoke/UIAutomationMcp.Smoke.csproj -c Release

      - name: Run CLI desktop query
        run: dotnet run --project src/UIAutomationMcp.CLI/UIAutomationMcp.CLI.csproj -c Release -- desktop

      - name: Run CLI focused query
        run: dotnet run --project src/UIAutomationMcp.CLI/UIAutomationMcp.CLI.csproj -c Release -- focused

