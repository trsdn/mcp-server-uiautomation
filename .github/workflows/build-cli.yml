name: Build CLI

permissions:
  contents: read

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/UIAutomationMcp.CLI/**'
      - 'src/UIAutomationMcp.Service/**'
      - 'src/UIAutomationMcp.ComInterop/**'
      - 'UIAutomationMcp.sln'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/build-cli.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/UIAutomationMcp.CLI/**'
      - 'src/UIAutomationMcp.Service/**'
      - 'src/UIAutomationMcp.ComInterop/**'
      - 'UIAutomationMcp.sln'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/build-cli.yml'

jobs:
  build-cli:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore src/UIAutomationMcp.CLI/UIAutomationMcp.CLI.csproj

      - name: Build CLI
        run: dotnet build src/UIAutomationMcp.CLI/UIAutomationMcp.CLI.csproj --no-restore --configuration Release

      - name: Upload CLI build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UIAutomationMcp-CLI-${{ github.sha }}
          path: src/UIAutomationMcp.CLI/bin/Release/net9.0-windows/

